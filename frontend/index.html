<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GuestBook — a decentralized on-chain guest book on Ethereum Sepolia.">
  <meta name="theme-color" content="#0b1020">
  <title>GuestBook DApp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">WEB3 • ETHEREUM SEPOLIA</p>
        <h1>GuestBook</h1>
        <p class="lead">Sign your name on-chain and watch the guest list update live.</p>
      </div>
      <div class="hero-actions">
        <span id="networkStatus" class="status-pill">Checking network…</span>
        <button id="connectBtn" class="primary">Connect MetaMask</button>
      </div>
    </header>

    <section class="stats">
      <article><span>Guests</span><strong id="guestCount">—</strong></article>
      <article><span>Wallet</span><strong id="walletAddress">Not connected</strong></article>
      <article><span>Contract</span><a id="contractLink" href="#" target="_blank" rel="noopener">View on Etherscan</a></article>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">ON-CHAIN SIGNATURE</p>
          <h2>Leave your mark</h2>
        </div>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>
      <form id="guestForm">
        <label for="name">Display name</label>
        <div class="form-row">
          <input id="name" name="name" maxlength="64" autocomplete="name" placeholder="Your name" required>
          <button id="signBtn" type="submit" class="primary">Sign Guest Book</button>
        </div>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <p class="eyebrow">LIVE ACTIVITY</p>
          <h2>Recent guests</h2>
        </div>
        <span id="liveIndicator" class="live"><i></i> live</span>
      </div>
      <div id="guestGrid" class="guest-grid"></div>
      <div id="emptyState" class="empty">No guests yet. Be the first to sign the book.</div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.16.0/dist/ethers.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="index.js"></script>
</body>
</html>
